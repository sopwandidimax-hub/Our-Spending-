<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our Spending ♡</title>
<style>
:root{--bg:#f7f7fb;--card:#fff;--ink:#181827;--muted:#858898;--p:#7667f7;--pink:#f38bb4;--line:#ececf3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.app{max-width:980px;margin:auto;padding:18px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{display:flex;gap:11px;align-items:center}.heart{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,var(--p),var(--pink));color:#fff;display:grid;place-items:center;font-size:22px}.muted,.label{color:var(--muted);font-size:11px}h1{font-size:20px;margin:0}
.hero{background:linear-gradient(135deg,#191a2b,#413b78);color:#fff;border-radius:27px;padding:22px}.hero h2{font-size:34px;margin:5px 0 14px}.period{display:flex;gap:7px;flex-wrap:wrap}.period button{background:#ffffff18;color:#fff;border:1px solid #ffffff25;border-radius:10px;padding:7px 10px;cursor:pointer}.period .active{background:#fff;color:#29254e}
.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:14px 0}.card{background:#fff;border:1px solid var(--line);border-radius:21px;padding:16px;box-shadow:0 10px 30px #25243b09}.value{font-size:19px;font-weight:800;margin-top:6px}.you .value{color:var(--p)}.isni .value{color:var(--pink)}
.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.section{margin-top:0}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.head h3{font-size:16px;margin:0}
.cat{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.cat:last-child{border:0}.ico{width:38px;height:38px;border-radius:12px;background:#f1f0ff;display:grid;place-items:center}.catmain{flex:1}.catname{font-size:12px;font-weight:700}.bar{height:7px;background:#eeeef4;border-radius:20px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--pink));border-radius:20px}.money{font-size:12px;font-weight:800}
.tx{display:flex;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.tx:last-child{border:0}.txmain{flex:1}.txname{font-size:12px;font-weight:750}.txmeta,.who{font-size:10px;color:var(--muted);margin-top:3px}.txmoney{text-align:right;font-size:12px;font-weight:800}.empty{text-align:center;color:var(--muted);padding:25px;font-size:12px}
.btn,.fab{border:0;cursor:pointer;font-weight:800;border-radius:14px}.btn{padding:10px 13px;background:#fff}.fab{position:fixed;right:18px;bottom:18px;background:linear-gradient(135deg,var(--p),#927dfc);color:#fff;padding:15px 19px;box-shadow:0 14px 30px #7667f755}
.modal{display:none;position:fixed;inset:0;background:#10101bb0;z-index:5;align-items:flex-end;justify-content:center;padding:10px}.modal.show{display:flex}.sheet{width:min(560px,100%);background:#fff;border-radius:27px 27px 17px 17px;padding:21px;max-height:94vh;overflow:auto}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field.full,.actions{grid-column:1/-1}.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;border:1px solid var(--line);background:#fafafe;border-radius:13px;padding:12px}.actions button{width:100%;padding:13px;border:0;border-radius:14px;font-weight:800}.primary{background:var(--p);color:#fff}.cancel{margin-top:7px;background:#f1f1f6}.toast{display:none;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#171827;color:#fff;padding:10px 14px;border-radius:13px;font-size:11px;z-index:9}.toast.on{display:block}
.status{font-size:10px;padding:5px 9px;border-radius:10px;background:#fff}.ok{color:#17845f}.bad{color:#b34b55}
@media(max-width:700px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.cards .total{grid-column:1/-1}}@media(max-width:420px){.form{grid-template-columns:1fr}.field.full,.actions{grid-column:auto}.cards{grid-template-columns:1fr}.cards .total{grid-column:auto}}
</style></head>
<body>
<div class="app">
<div class="top"><div class="brand"><div class="heart">♡</div><div><h1>Our Spending</h1><div class="muted">Sopwan & Isni · catatan pengeluaran</div></div></div><span id="status" class="status bad">Belum terhubung</span></div>
<div class="hero"><div class="muted" style="color:#fff9">Total pengeluaran</div><h2 id="total">Rp0</h2><div class="period"><button class="active" data-p="month">Bulan ini</button><button data-p="week">Minggu ini</button><button data-p="all">Semua</button></div></div>
<div class="cards"><div class="card you"><div class="label">Pengeluaran Aku</div><div class="value" id="me">Rp0</div></div><div class="card isni"><div class="label">Pengeluaran Isni</div><div class="value" id="isni">Rp0</div></div><div class="card total"><div class="label">Total Kita Berdua</div><div class="value" id="both">Rp0</div></div></div>
<div class="grid"><section class="card"><div class="head"><h3>Uang kita habis buat apa?</h3></div><div id="cats"></div></section><section class="card"><div class="head"><h3>Ringkasan</h3></div><div id="summary"></div></section></div>
<section class="card" style="margin-top:12px"><div class="head"><h3>Riwayat pengeluaran</h3><button class="btn" onclick="loadData()">↻ Refresh</button></div><div id="list"></div></section>
</div>
<button class="fab" onclick="openModal()">＋ Tambah pengeluaran</button>
<div class="modal" id="modal"><div class="sheet"><h3>Catat pengeluaran ✨</h3><form class="form" id="form">
<div class="field"><label>Tanggal</label><input id="date" type="date" required></div><div class="field"><label>Nominal</label><input id="amount" type="number" min="0" step="1000" required></div>
<div class="field full"><label>Pengeluaran untuk apa?</label><input id="name" placeholder="Contoh: Makan setelah nonton" required></div>
<div class="field"><label>Siapa yang mengeluarkan?</label><select id="person"><option>Aku</option><option>Isni</option></select></div>
<div class="field"><label>Kategori</label><select id="category"><option>🍜 Makan</option><option>☕ Nongkrong</option><option>🎬 Nonton</option><option>🎮 Hiburan / Game</option><option>🛵 Transportasi</option><option>🛍️ Belanja</option><option>🏨 Penginapan</option><option>🎁 Lainnya</option></select></div>
<div class="field full"><label>Tempat / catatan</label><input id="note" placeholder="Opsional"></div>
<div class="actions"><button class="primary">Simpan ke database</button><button type="button" class="cancel" onclick="closeModal()">Batal</button></div>
</form></div></div><div class="toast" id="toast"></div>
<script>
/* SET THIS AFTER DEPLOYING GOOGLE APPS SCRIPT */
const API_URL="https://script.google.com/macros/s/AKfycbxX0wgiDL90ZpSu_iWbMXvdRKWP7PYpGHEKamJTvwOgo8NB0VZ5KpBDHUccW0j876cZ/exec";
let period="month", all=[];
const rp=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function filtered(){let now=new Date();return all.filter(x=>{let d=new Date(x.date+"T00:00:00");if(period==="all")return true;if(period==="month")return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();let s=new Date(now);s.setHours(0,0,0,0);s.setDate(now.getDate()-6);return d>=s&&d<=now})}
function render(){let a=filtered(),t=a.reduce((s,x)=>s+Number(x.amount),0),me=a.filter(x=>x.person==="Aku").reduce((s,x)=>s+Number(x.amount),0),is=a.filter(x=>x.person==="Isni").reduce((s,x)=>s+Number(x.amount),0);total.textContent=rp(t);meEl.textContent=rp(me);isniEl.textContent=rp(is);both.textContent=rp(t);
let c={};a.forEach(x=>c[x.category]=(c[x.category]||0)+Number(x.amount));let mx=Math.max(...Object.values(c),1);cats.innerHTML=Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="cat"><div class="ico">${k.split(" ")[0]}</div><div class="catmain"><div class="catname">${esc(k.replace(/^\S+\s/,""))}</div><div class="bar"><i style="width:${v/mx*100}%"></i></div></div><div class="money">${rp(v)}</div></div>`).join("")||'<div class="empty">Belum ada pengeluaran.</div>';
summary.innerHTML=`<p><span class="label">Jumlah transaksi</span><br><b>${a.length}</b></p><p><span class="label">Rata-rata transaksi</span><br><b>${rp(a.length?t/a.length:0)}</b></p>`;
list.innerHTML=[...all].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(x=>`<div class="tx"><div class="ico">${x.category.split(" ")[0]}</div><div class="txmain"><div class="txname">${esc(x.name)}</div><div class="txmeta">${new Date(x.date+"T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"})}${x.note?" · "+esc(x.note):""}</div></div><div class="txmoney">${rp(x.amount)}<div class="who">${esc(x.person)}</div></div></div>`).join("")||'<div class="empty">Belum ada catatan 🤍</div>'}
const meEl=document.getElementById("me"),isniEl=document.getElementById("isni");
async function loadData(){if(!API_URL.startsWith("http")){setStatus(false,"Belum terhubung");render();return}try{setStatus(true,"Terhubung");let r=await fetch(API_URL+"?action=list");let j=await r.json();if(!j.ok)throw Error(j.error);all=j.items||[];render()}catch(e){setStatus(false,"Gagal memuat");toastMsg("Tidak bisa mengambil data online")}}
async function addData(item){if(!API_URL.startsWith("http"))throw Error("API belum diatur");let r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"add",item})});let j=await r.json();if(!j.ok)throw Error(j.error);return j}
function setStatus(ok,t){status.textContent=t;status.className="status "+(ok?"ok":"bad")}
function openModal(){date.value=new Date().toISOString().slice(0,10);modal.classList.add("show")}function closeModal(){modal.classList.remove("show");form.reset()}
form.onsubmit=async e=>{e.preventDefault();try{await addData({date:date.value,amount:+amount.value,name:name.value,person:person.value,category:category.value,note:note.value});closeModal();toastMsg("Tersimpan online ✨");await loadData()}catch(err){toastMsg("Gagal menyimpan: "+err.message)}}
document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-p]").forEach(x=>x.classList.remove("active"));b.classList.add("active");period=b.dataset.p;render()});
function toastMsg(t){toast.textContent=t;toast.classList.add("on");setTimeout(()=>toast.classList.remove("on"),2200)}
render();loadData();
</script></body></html>
